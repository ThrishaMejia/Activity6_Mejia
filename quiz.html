
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Quiz | Quizivia</title>
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>

<header class="site-header">
    <h1 class="logo">
        <a href="index.html">
            <img src="assets/images/quizivia_logo.png" alt="Quizivia Logo">
        </a>
    </h1>

    <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html" aria-label="Home" title="Home">🏠</a>
        <a href="categories.html" class="active" aria-label="Categories" title="Categories">📚</a>
        <a href="daily-quiz.html" aria-label="Daily Quiz" title="Daily Quiz">📅</a>
        <a href="leaderboard.html" aria-label="Leaderboard" title="Leaderboard">🏆</a>
        <a href="profile.html" id="qv-profile-link" aria-label="Profile" title="Profile">👤</a>
        <a href="index.html#about" aria-label="About" title="About">ℹ️</a>
    </nav>
</header>

<main class="play-quiz-page">

    <section class="page-intro">
        <p class="eyebrow">✦ LET THE CHALLENGE BEGIN ✦</p>
        <h2 id="quiz-title">Quiz <span>Challenge!</span></h2>
        <p id="quiz-description">Test your knowledge and earn XP!</p>
    </section>

    <section class="quiz-game-card" id="quiz-card">

        <div class="quiz-game-top">
            <div>
                <span class="quiz-small-label">QUESTION</span>
                <h3 id="question-number">1 / 10</h3>
            </div>

            <div class="quiz-timer">
                <span>⏱ TIME LEFT</span>
                <strong id="timer">05:00</strong>
            </div>
        </div>

        <div class="quiz-progress-track">
            <div class="quiz-progress-fill" id="quiz-progress"></div>
        </div>

        <div class="quiz-question-area">
            <span class="quiz-question-label">✦ YOUR QUESTION</span>
            <h2 id="question-text">Loading question...</h2>
            <div class="quiz-options" id="answer-options"></div>
        </div>

        <p class="quiz-feedback" id="quiz-feedback" aria-live="polite"></p>

        <div class="quiz-game-bottom">
            <button type="button" class="btn" id="action-button" disabled>
                SAVE & NEXT
            </button>
        </div>

    </section>

    <div class="quiz-exit">
        <a href="categories.html">← EXIT QUIZ</a>
    </div>

</main>

<footer class="site-footer">
    <p>© 2026 Quizivia. Learn, play, and challenge yourself!</p>
</footer>

<script type="module">
import { createClient } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// SUPABASE CONNECTION

const SUPABASE_URL = "https://mnknxizgpkznkboingbf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_2Y6PlxPEFUdgIXuTTAhtag_XGPy-008";

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

// PLAYER SESSION

let player;

try {
    player = JSON.parse(
        localStorage.getItem("quizivia_player") || "null"
    );
} catch {
    player = null;
}

if (!player || !player.id || !player.token) {
    window.location.replace("login.html");
    throw new Error("Player login required.");
}

// URL PARAMETERS

const params = new URLSearchParams(window.location.search);

const category = (params.get("category") || "").toLowerCase();
const difficulty = (params.get("difficulty") || "easy").toLowerCase();

// CATEGORY NAMES

const categoryNames = {
    history: "History",
    science: "Science",
    mathematics: "Mathematics",
    "general-knowledge": "General Knowledge"
};

// QUIZ TITLES

const quizTitles = {
    history: {
        easy: "Philippine Beginnings",
        medium: "Across the Centuries",
        hard: "Untold History"
    },

    science: {
        easy: "Science Around Us",
        medium: "Nature & Discovery",
        hard: "Philippine Science Challenge"
    },

    mathematics: {
        easy: "Everyday Math",
        medium: "Numbers in Action",
        hard: "Math Mastery"
    },

    "general-knowledge": {
        easy: "Know the Philippines",
        medium: "Beyond the Basics",
        hard: "Pinoy Brain Challenge"
    }
};

const validDifficulties = ["easy", "medium", "hard"];

const quizTitle =
    quizTitles[category]?.[difficulty] || "Category Quiz";

// ELEMENTS

const title = document.getElementById("quiz-title");
const description = document.getElementById("quiz-description");
const questionNumber = document.getElementById("question-number");
const questionText = document.getElementById("question-text");
const optionsContainer = document.getElementById("answer-options");
const progress = document.getElementById("quiz-progress");
const timerDisplay = document.getElementById("timer");
const feedback = document.getElementById("quiz-feedback");
const actionButton = document.getElementById("action-button");
const quizCard = document.getElementById("quiz-card");

// QUIZ STATE

let questions = [];
let answers = [];
let sessionId = null;

let currentQuestion = 0;
let selectedAnswer = null;

let deadline = null;
let timerInterval = null;

let finished = false;
let savingResult = false;
let submissionFailed = false;

// SETTINGS

const QUIZ_DURATION = 300;
const SESSION_MAX_AGE = 2 * 60 * 60 * 1000;

const NO_ANSWER = "__QUIZIVIA_NO_ANSWER__";

const storageKey =
    `quizivia_category_progress_${player.id}_${category}_${difficulty}`;

// LOCAL PROGRESS

function saveProgress() {

    if (!sessionId || !questions.length || finished) return;

    const progressData = {
        sessionId,
        questions,
        answers,
        currentQuestion,
        selectedAnswer,
        deadline,
        createdAt: Date.now()
    };

    try {
        localStorage.setItem(
            storageKey,
            JSON.stringify(progressData)
        );
    } catch (error) {
        console.error("Could not save quiz progress:", error);
    }
}

function clearProgress() {
    localStorage.removeItem(storageKey);
}

function restoreProgress() {

    let saved;

    try {
        saved = JSON.parse(
            localStorage.getItem(storageKey) || "null"
        );
    } catch {
        clearProgress();
        return false;
    }

    if (!saved) return false;

    if (
        !saved.sessionId ||
        !Array.isArray(saved.questions) ||
        saved.questions.length !== 10 ||
        !Array.isArray(saved.answers) ||
        saved.answers.length !== 10 ||
        !Number.isInteger(saved.currentQuestion) ||
        saved.currentQuestion < 0 ||
        saved.currentQuestion >= 10 ||
        !Number.isFinite(saved.deadline) ||
        !Number.isFinite(saved.createdAt)
    ) {
        clearProgress();
        return false;
    }

    if (Date.now() - saved.createdAt > SESSION_MAX_AGE) {
        clearProgress();

        showError(
            "Your previous quiz session has expired. Please start a new quiz."
        );

        return true;
    }

    questions = saved.questions;
    answers = saved.answers;
    sessionId = saved.sessionId;

    currentQuestion = saved.currentQuestion;
    selectedAnswer = saved.selectedAnswer ?? null;

    deadline = saved.deadline;

    return true;
}

// SHOW ERROR

function showError(message) {

    clearInterval(timerInterval);

    title.textContent = "Quiz Unavailable!";
    description.textContent = message;

    quizCard.innerHTML = "";

    const errorText = document.createElement("p");
    errorText.className = "quiz-feedback";
    errorText.textContent = message;

    const backLink = document.createElement("a");
    backLink.className = "btn";
    backLink.href = "categories.html";
    backLink.textContent = "BACK TO CATEGORIES";

    quizCard.appendChild(errorText);
    quizCard.appendChild(backLink);
}

// SET QUIZ HEADER

function setQuizHeader() {

    title.innerHTML = "";

    title.append(
        document.createTextNode(quizTitle + " ")
    );

    const titleSpan = document.createElement("span");
    titleSpan.textContent = "Challenge!";
    title.appendChild(titleSpan);

    const formattedDifficulty =
        difficulty.charAt(0).toUpperCase() + difficulty.slice(1);

    description.textContent =
        categoryNames[category] +
        " • " +
        formattedDifficulty +
        " • Test your knowledge and earn XP!";

    document.title = quizTitle + " | Quizivia";
}

// LOAD QUESTIONS

async function loadQuestions() {

    if (
        !categoryNames[category] ||
        !quizTitles[category]?.[difficulty] ||
        !validDifficulties.includes(difficulty)
    ) {
        showError("Invalid quiz selection. Please choose a quiz again.");
        return;
    }

    try {

        const restored = restoreProgress();

        if (restored) {

            if (!sessionId) return;

            setQuizHeader();

            if (deadline <= Date.now()) {
                timeLeft = 0;
                updateTimer();
                renderQuestion();
                finishQuiz();
                return;
            }

            renderQuestion();
            startTimer();

            return;
        }

        const { data, error } = await supabase.functions.invoke(
            "get-questions",
            {
                headers: {
                    Authorization: `Bearer ${player.token}`
                },
                body: {
                    category: category,
                    difficulty: difficulty
                }
            }
        );

        if (error) throw error;

        if (
            !data ||
            !Array.isArray(data.questions) ||
            !data.session_id
        ) {
            throw new Error("Invalid quiz session response.");
        }

        if (data.questions.length !== 10) {
            showError("We need exactly 10 questions to start this quiz.");
            return;
        }

        questions = data.questions;
        sessionId = data.session_id;

        answers = new Array(questions.length).fill(null);

        currentQuestion = 0;
        selectedAnswer = null;

        deadline = Date.now() + QUIZ_DURATION * 1000;

        setQuizHeader();

        saveProgress();

        renderQuestion();
        startTimer();

    } catch (error) {

        console.error("Question loading error:", error);

        showError(
            "We couldn't load your quiz. Please log in again or try later."
        );
    }
}

// DISPLAY QUESTION

function renderQuestion() {

    if (finished || !questions.length) return;

    const item = questions[currentQuestion];

    questionNumber.textContent =
        (currentQuestion + 1) + " / " + questions.length;

    questionText.textContent = item.question_text;

    progress.style.width =
        (currentQuestion / questions.length * 100) + "%";

    optionsContainer.innerHTML = "";

    feedback.textContent = "";
    feedback.className = "quiz-feedback";

    actionButton.disabled = selectedAnswer === null;
    actionButton.hidden = false;

    actionButton.textContent =
        currentQuestion === questions.length - 1
            ? "SUBMIT QUIZ"
            : "SAVE & NEXT";

    let options = item.options;

    if (typeof options === "string") {
        try {
            options = JSON.parse(options);
        } catch {
            options = [];
        }
    }

    if (!Array.isArray(options) || options.length !== 4) {
        showError("One of the questions has invalid answer options.");
        return;
    }

    options.forEach((option, index) => {

        const button = document.createElement("button");

        button.type = "button";
        button.className = "quiz-option";

        const letter = document.createElement("span");
        letter.className = "option-letter";
        letter.textContent = String.fromCharCode(65 + index);

        const answerText = document.createElement("span");
        answerText.textContent = option;

        button.appendChild(letter);
        button.appendChild(answerText);

        if (selectedAnswer === option) {
            button.classList.add("selected");
        }

        button.addEventListener("click", () => {

            if (finished || savingResult) return;

            selectedAnswer = option;

            document.querySelectorAll(".quiz-option")
                .forEach(item => {
                    item.classList.remove("selected");
                });

            button.classList.add("selected");

            actionButton.disabled = false;

            saveProgress();
        });

        optionsContainer.appendChild(button);
    });
}

// SAVE ANSWER AND MOVE FORWARD

function handleAction() {

    if (finished || savingResult) return;

    if (submissionFailed) {
        finishQuiz();
        return;
    }

    if (selectedAnswer === null) return;

    answers[currentQuestion] = selectedAnswer;

    selectedAnswer = null;

    saveProgress();

    if (currentQuestion === questions.length - 1) {
        finishQuiz();
        return;
    }

    currentQuestion++;

    saveProgress();

    renderQuestion();
}

// TIMER

function formatTime(seconds) {

    const minutes = Math.floor(seconds / 60);
    const remaining = seconds % 60;

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(remaining).padStart(2, "0")
    );
}

function updateTimer() {

    timerDisplay.textContent = formatTime(timeLeft);

    if (timeLeft <= 60) {
        timerDisplay.classList.add("warning");
    }
}

function startTimer() {

    clearInterval(timerInterval);

    function tick() {

        timeLeft = Math.max(
            0,
            Math.ceil((deadline - Date.now()) / 1000)
        );

        updateTimer();

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            finishQuiz();
        }
    }

    tick();

    if (timeLeft <= 0) return;

    timerInterval = setInterval(tick, 1000);
}

// SAVE RESULT SECURELY

async function finishQuiz() {

    if (
        finished ||
        savingResult ||
        questions.length !== 10 ||
        !sessionId
    ) return;

    finished = true;
    savingResult = true;

    clearInterval(timerInterval);

    const finalAnswers = answers.map(answer =>
        answer === null ? NO_ANSWER : answer
    );

    actionButton.disabled = true;
    actionButton.hidden = false;
    actionButton.textContent = "SAVING RESULT...";

    feedback.textContent =
        "✦ Checking your answers and saving your XP...";

    feedback.className = "quiz-feedback";

    try {

        const answerSubmission = questions.map((item, index) => ({
            question_id: item.question_id,
            answer: finalAnswers[index]
        }));

        const { data, error } = await supabase.functions.invoke(
            "save-quiz-result",
            {
                headers: {
                    Authorization: `Bearer ${player.token}`
                },
                body: {
                    session_id: sessionId,
                    answers: answerSubmission
                }
            }
        );

        if (error) throw error;

        if (
            !data ||
            data.success !== true ||
            !data.result
        ) {
            throw new Error(
                data?.error || "Unable to save quiz result."
            );
        }

        const saved = data.result;

        const result = {
            category: category,
            quizId: category + "-" + difficulty,
            difficulty: difficulty,
            title: quizTitle,
            score: saved.correct_answers,
            total: saved.total_questions,
            timeLeft: timeLeft,
            earned_xp: saved.earned_xp,
            xp: saved.xp,
            level: saved.level
        };

        player.xp = saved.xp;
        player.level = saved.level;

        localStorage.setItem(
            "quizivia_player",
            JSON.stringify(player)
        );

        sessionStorage.setItem(
            "quiziviaResult",
            JSON.stringify(result)
        );

        clearProgress();

        window.location.href = "quiz-results.html";

    } catch (error) {

        console.error("Result saving error:", error);

        savingResult = false;
        finished = false;
        submissionFailed = true;

        feedback.textContent =
            "We couldn't save your result. Your answers are still saved. Please retry.";

        feedback.className = "quiz-feedback wrong";

        actionButton.disabled = false;
        actionButton.hidden = false;
        actionButton.textContent = "RETRY SUBMISSION";
    }
}

// BUTTON EVENT

actionButton.addEventListener("click", handleAction);

// START QUIZ

loadQuestions();

</script>

</body>
</html>
