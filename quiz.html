
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Quiz | Quizivia</title>
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>

<header class="site-header">
    <h1 class="logo">
        <a href="index.html">
            <img src="assets/images/quizivia_logo.png" alt="Quizivia Logo">
        </a>
    </h1>

    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="categories.html" class="active">Categories</a>
        <a href="daily-quiz.html">Daily Quiz</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="index.html#about">About</a>
    </nav>
</header>

<main class="play-quiz-page">

    <section class="page-intro">
        <p class="eyebrow">✦ LET THE CHALLENGE BEGIN ✦</p>
        <h2 id="quiz-title">Quiz <span>Challenge!</span></h2>
        <p id="quiz-description">Test your knowledge and earn XP!</p>
    </section>

    <section class="quiz-game-card" id="quiz-card">

        <div class="quiz-game-top">
            <div>
                <span class="quiz-small-label">QUESTION</span>
                <h3 id="question-number">1 / 10</h3>
            </div>

            <div class="quiz-timer">
                <span>⏱ TIME LEFT</span>
                <strong id="timer">05:00</strong>
            </div>
        </div>

        <div class="quiz-progress-track">
            <div class="quiz-progress-fill" id="quiz-progress"></div>
        </div>

        <div class="quiz-question-area">
            <span class="quiz-question-label">✦ YOUR QUESTION</span>
            <h2 id="question-text">Loading question...</h2>

            <div class="quiz-options" id="answer-options"></div>
        </div>

        <p class="quiz-feedback" id="quiz-feedback" aria-live="polite"></p>

        <div class="quiz-game-bottom">

            <button
                type="button"
                class="btn"
                id="submit-button"
                disabled>
                SUBMIT ANSWER
            </button>

            <button
                type="button"
                class="btn quiz-next-btn"
                id="next-button"
                disabled
                hidden>
                NEXT QUESTION →
            </button>

        </div>

    </section>

    <div class="quiz-exit">
        <a href="categories.html">← EXIT QUIZ</a>
    </div>

</main>

<footer class="site-footer">
    <p>© 2026 Quizivia. Learn, play, and challenge yourself!</p>
</footer>

<script type="module">
import { createClient } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// Use the SAME values from your admin.html.
// Never use your Supabase Secret Key here.

const SUPABASE_URL = "PASTE_YOUR_PROJECT_URL";
const SUPABASE_PUBLISHABLE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY";

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

// URL PARAMETERS

const params = new URLSearchParams(window.location.search);

const category = (params.get("category") || "").toLowerCase();
const quizId = params.get("quiz") || "";
const difficulty = (params.get("difficulty") || "easy").toLowerCase();

// QUIZ INFORMATION

const categoryNames = {
    history: "History",
    science: "Science",
    mathematics: "Mathematics",
    "general-knowledge": "General Knowledge"
};

const quizTitles = {
    "ancient-civilizations": "Ancient Civilizations",
    "solar-system": "Our Solar System",
    "basic-mathematics": "Basic Mathematics",
    "everyday-knowledge": "Everyday Knowledge"
};

const quizTitle = quizTitles[quizId] || "Category Quiz";

// ELEMENTS

const title = document.getElementById("quiz-title");
const description = document.getElementById("quiz-description");
const questionNumber = document.getElementById("question-number");
const questionText = document.getElementById("question-text");
const optionsContainer = document.getElementById("answer-options");
const progress = document.getElementById("quiz-progress");
const timerDisplay = document.getElementById("timer");
const feedback = document.getElementById("quiz-feedback");
const submitButton = document.getElementById("submit-button");
const nextButton = document.getElementById("next-button");
const quizCard = document.getElementById("quiz-card");

// QUIZ STATE

let questions = [];
let currentQuestion = 0;
let score = 0;
let selectedAnswer = null;
let timeLeft = 300;
let timerInterval = null;
let finished = false;
let submitted = false;
let checkingAnswer = false;

// SHOW ERROR

function showError(message) {
    clearInterval(timerInterval);

    title.textContent = "Quiz Unavailable!";
    description.textContent = message;

    quizCard.innerHTML = `
        <p class="quiz-feedback">${message}</p>
        <a class="btn" href="categories.html">
            BACK TO CATEGORIES
        </a>
    `;
}

// LOAD QUESTIONS FROM SUPABASE

async function loadQuestions() {

    if (
        !categoryNames[category] ||
        !quizTitles[quizId] ||
        !["easy", "medium", "hard"].includes(difficulty)
    ) {
        showError("Invalid quiz selection. Please choose a quiz again.");
        return;
    }

    try {
        const { data, error } = await supabase.functions.invoke(
            "get-questions",
            {
                body: {
                    category: category,
                    difficulty: difficulty
                }
            }
        );

        if (error) throw error;

        if (!data || !Array.isArray(data.questions)) {
            throw new Error("Unable to load questions.");
        }

        if (data.questions.length < 10) {
            showError(
                "Not enough active questions yet. " +
                "Please ask the admin to add at least 10 questions " +
                "for this category and difficulty."
            );
            return;
        }

        questions = data.questions.slice(0, 10);

        title.innerHTML = "";
        title.append(
            document.createTextNode(quizTitle + " ")
        );

        const titleSpan = document.createElement("span");
        titleSpan.textContent = "Challenge!";
        title.appendChild(titleSpan);

        description.textContent =
            categoryNames[category] +
            " • " +
            difficulty.charAt(0).toUpperCase() +
            difficulty.slice(1) +
            " • Test your knowledge and earn XP!";

        document.title = quizTitle + " | Quizivia";

        renderQuestion();
        startTimer();

    } catch (error) {
        console.error("Question loading error:", error);

        showError(
            "We couldn't load your questions. Please try again later."
        );
    }
}

// DISPLAY QUESTION

function renderQuestion() {

    if (finished) return;

    const item = questions[currentQuestion];

    selectedAnswer = null;
    submitted = false;
    checkingAnswer = false;

    questionNumber.textContent =
        (currentQuestion + 1) + " / " + questions.length;

    questionText.textContent = item.question_text;

    progress.style.width =
        (currentQuestion / questions.length * 100) + "%";

    optionsContainer.innerHTML = "";
    feedback.textContent = "";
    feedback.className = "quiz-feedback";

    submitButton.disabled = true;
    submitButton.hidden = false;
    submitButton.textContent = "SUBMIT ANSWER";

    nextButton.disabled = true;
    nextButton.hidden = true;

    let options = item.options;

    if (typeof options === "string") {
        try {
            options = JSON.parse(options);
        } catch {
            options = [];
        }
    }

    if (!Array.isArray(options) || options.length !== 4) {
        showError("One of the questions has invalid answer options.");
        return;
    }

    options.forEach((option, index) => {

        const button = document.createElement("button");

        button.type = "button";
        button.className = "quiz-option";

        const letter = document.createElement("span");
        letter.className = "option-letter";
        letter.textContent = String.fromCharCode(65 + index);

        const answerText = document.createElement("span");
        answerText.textContent = option;

        button.appendChild(letter);
        button.appendChild(answerText);

        // SELECT ANSWER ONLY
        // Player can still change their selection before submitting.

        button.addEventListener("click", () => {

            if (submitted || checkingAnswer || finished) return;

            selectedAnswer = option;

            document.querySelectorAll(".quiz-option").forEach(btn => {
                btn.classList.remove("selected");
            });

            button.classList.add("selected");

            submitButton.disabled = false;
        });

        optionsContainer.appendChild(button);
    });

    nextButton.textContent =
        currentQuestion === questions.length - 1
            ? "FINISH QUIZ ✦"
            : "NEXT QUESTION →";
}

// SUBMIT AND CHECK ANSWER

async function submitAnswer() {

    if (
        selectedAnswer === null ||
        submitted ||
        checkingAnswer ||
        finished
    ) {
        return;
    }

    checkingAnswer = true;
    submitButton.disabled = true;
    submitButton.textContent = "CHECKING...";

    try {

        const item = questions[currentQuestion];

        const { data, error } = await supabase.functions.invoke(
            "check-answer",
            {
                body: {
                    question_id: item.question_id,
                    answer: selectedAnswer
                }
            }
        );

        if (error) throw error;

        if (!data || typeof data.correct !== "boolean") {
            throw new Error("Invalid answer response.");
        }

        if (finished) return;

        submitted = true;
        checkingAnswer = false;

        if (data.correct) {
            score++;

            feedback.textContent = "✦ Correct! Great job!";
            feedback.className = "quiz-feedback correct";

        } else {

            feedback.textContent = "Not quite! Better luck next time. ♡";
            feedback.className = "quiz-feedback wrong";
        }

        // LOCK ALL ANSWERS AFTER SUBMISSION

        document.querySelectorAll(".quiz-option").forEach(button => {

            button.disabled = true;

            const optionText =
                button.querySelector("span:last-child").textContent;

            if (optionText === selectedAnswer) {
                button.classList.add(
                    data.correct ? "correct" : "wrong"
                );
            }
        });

        submitButton.hidden = true;

        nextButton.hidden = false;
        nextButton.disabled = false;

    } catch (error) {

        console.error("Answer checking error:", error);

        checkingAnswer = false;
        submitButton.disabled = false;
        submitButton.textContent = "SUBMIT ANSWER";

        feedback.textContent =
            "Unable to check your answer. Please try again.";

        feedback.className = "quiz-feedback wrong";
    }
}

// NEXT QUESTION

function nextQuestion() {

    if (!submitted || finished || checkingAnswer) return;

    currentQuestion++;

    if (currentQuestion >= questions.length) {
        finishQuiz();
        return;
    }

    renderQuestion();
}

// TIMER

function formatTime(seconds) {

    const minutes = Math.floor(seconds / 60);
    const remaining = seconds % 60;

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(remaining).padStart(2, "0")
    );
}

function updateTimer() {

    timerDisplay.textContent = formatTime(timeLeft);

    if (timeLeft <= 60) {
        timerDisplay.classList.add("warning");
    }

}

function startTimer() {

    updateTimer();

    timerInterval = setInterval(() => {

        if (finished) return;

        timeLeft--;

        updateTimer();

        if (timeLeft <= 0) {
            finishQuiz();
        }

    }, 1000);
}

// FINISH QUIZ

function finishQuiz() {

    if (finished || questions.length === 0) return;

    finished = true;

    clearInterval(timerInterval);

    const result = {
        category: category,
        quizId: quizId,
        difficulty: difficulty,
        title: quizTitle,
        score: score,
        total: questions.length,
        timeLeft: timeLeft
    };

    sessionStorage.setItem(
        "quiziviaResult",
        JSON.stringify(result)
    );

    window.location.href = "quiz-results.html";
}

// BUTTON EVENTS

submitButton.addEventListener("click", submitAnswer);

nextButton.addEventListener("click", nextQuestion);

// START

loadQuestions();

</script>

</body>
</html>
