
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzes | Quizivia</title>
    <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>

<header class="site-header">
    <h1 class="logo">
        <a href="index.html">
            <img src="assets/images/quizivia_logo.png" alt="Quizivia Logo">
        </a>
    </h1>

    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="categories.html" class="active">Categories</a>
        <a href="daily-quiz.html">Daily Quiz</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="index.html#about">About</a>
    </nav>
</header>

<main class="category-quizzes-page">

    <section class="page-intro">
        <p class="eyebrow">✦ YOUR NEXT CHALLENGE ✦</p>
        <h2 id="category-title">Choose Your <span>Quiz!</span></h2>
        <p id="category-description">
            Pick a quiz and test what you know!
        </p>
    </section>

    <section class="quiz-list-section">
        <div class="quiz-list-heading">
            <h2>AVAILABLE QUIZ</h2>
            <p>Choose a challenge to begin your adventure.</p>
        </div>

        <div class="category-quiz-grid" id="quiz-grid"></div>

        <div class="category-back">
            <a href="categories.html">← Back to Categories</a>
        </div>
    </section>

</main>

<footer class="site-footer">
    <p>© 2026 Quizivia. Learn, play, and challenge yourself!</p>
</footer>

<script>
const params = new URLSearchParams(window.location.search);
const category = params.get("category");

const quizData = {
    history: {
        title: "History",
        description: "Travel through time and explore the past.",
        icon: "🏛️",
        quizzes: [
            {
                title: "Ancient Civilizations",
                level: "BEGINNER",
                questions: 10,
                time: "5 MINUTES",
                id: "ancient-civilizations"
            }
        ]
    },

    science: {
        title: "Science",
        description: "Discover the wonders of science and nature.",
        icon: "🔬",
        quizzes: [
            {
                title: "Our Solar System",
                level: "BEGINNER",
                questions: 10,
                time: "5 MINUTES",
                id: "solar-system"
            }
        ]
    },

    mathematics: {
        title: "Mathematics",
        description: "Challenge your mind with numbers and equations.",
        icon: "📐",
        quizzes: [
            {
                title: "Basic Mathematics",
                level: "BEGINNER",
                questions: 10,
                time: "5 MINUTES",
                id: "basic-mathematics"
            }
        ]
    },

    "general-knowledge": {
        title: "General Knowledge",
        description: "Test your knowledge about the world around you.",
        icon: "🌎",
        quizzes: [
            {
                title: "Everyday Knowledge",
                level: "BEGINNER",
                questions: 10,
                time: "5 MINUTES",
                id: "everyday-knowledge"
            }
        ]
    }
};

const selectedCategory = quizData[category];
const quizGrid = document.getElementById("quiz-grid");

if (selectedCategory) {
    document.title = selectedCategory.title + " Quizzes | Quizivia";

    document.getElementById("category-title").innerHTML =
        selectedCategory.title + " <span>Quizzes!</span>";

    document.getElementById("category-description").textContent =
        selectedCategory.description;

    selectedCategory.quizzes.forEach((quiz, index) => {
        const card = document.createElement("article");
        card.className = "category-quiz-card";

        card.innerHTML = `
            <div class="quiz-card-icon">${selectedCategory.icon}</div>

            <div class="quiz-card-details">
                <span class="quiz-card-level">${quiz.level}</span>
                <h3>${quiz.title}</h3>
                <p>${quiz.questions} Questions · ${quiz.time}</p>
                <a href="quiz.html?category=${encodeURIComponent(category)}&quiz=${encodeURIComponent(quiz.id)}"
                   class="btn">
                    PLAY QUIZ →
                </a>
            </div>
        `;

        quizGrid.appendChild(card);
    });

} else {
    document.getElementById("category-title").textContent =
        "Category Not Found";

    document.getElementById("category-description").textContent =
        "Please choose a valid category.";

    quizGrid.innerHTML = `
        <p>Please return to the Categories page and choose a category.</p>
    `;
}
</script>

</body>
</html>
