
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzes | Quizivia</title>
    <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>

<header class="site-header">
    <h1 class="logo">
        <a href="index.html">
            <img src="assets/images/quizivia_logo.png" alt="Quizivia Logo">
        </a>
    </h1>

   <nav class="main-nav" aria-label="Main navigation">
    <a href="index.html" aria-label="Home" title="Home">🏠</a>
    <a href="categories.html" class="active" aria-label="Categories" title="Categories">📚</a>
    <a href="daily-quiz.html" aria-label="Daily Quiz" title="Daily Quiz">📅</a>
    <a href="leaderboard.html" aria-label="Leaderboard" title="Leaderboard">🏆</a>
    <a href="profile.html" id="qv-profile-link" aria-label="Profile" title="Profile">👤</a>
    <a href="index.html#about" aria-label="About" title="About">ℹ️</a>
</nav>
</header>

<main class="category-quizzes-page">

    <section class="page-intro">
        <p class="eyebrow">✦ YOUR NEXT CHALLENGE ✦</p>
        <h2 id="category-title">Choose Your <span>Quiz!</span></h2>
        <p id="category-description">
            Pick a difficulty and test what you know!
        </p>
    </section>

    <section class="quiz-list-section">
        <div class="quiz-list-heading">
            <h2>CHOOSE YOUR DIFFICULTY</h2>
            <p>Explore, learn, and challenge yourself!</p>
        </div>

        <div class="category-quiz-grid" id="quiz-grid"></div>

        <div class="category-back">
            <a href="categories.html">← Back to Categories</a>
        </div>
    </section>

</main>

<footer class="site-footer">
    <p>© 2026 Quizivia. Learn, play, and challenge yourself!</p>
</footer>

<script>
const params = new URLSearchParams(window.location.search);
const category = (params.get("category") || "").toLowerCase();

const quizData = {
    history: {
        title: "History",
        description: "Discover the stories and events that shaped the Philippines.",
        icon: "🏛️",
        quizzes: [
            {
                title: "Philippine Beginnings",
                difficulty: "easy"
            },
            {
                title: "Across the Centuries",
                difficulty: "medium"
            },
            {
                title: "Untold History",
                difficulty: "hard"
            }
        ]
    },

    science: {
        title: "Science",
        description: "Explore science, nature, and discoveries around the Philippines.",
        icon: "🔬",
        quizzes: [
            {
                title: "Science Around Us",
                difficulty: "easy"
            },
            {
                title: "Nature & Discovery",
                difficulty: "medium"
            },
            {
                title: "Philippine Science Challenge",
                difficulty: "hard"
            }
        ]
    },

    mathematics: {
        title: "Mathematics",
        description: "Use numbers and problem-solving in everyday Filipino life.",
        icon: "📐",
        quizzes: [
            {
                title: "Everyday Math",
                difficulty: "easy"
            },
            {
                title: "Numbers in Action",
                difficulty: "medium"
            },
            {
                title: "Math Mastery",
                difficulty: "hard"
            }
        ]
    },

    "general-knowledge": {
        title: "General Knowledge",
        description: "Test what you know about the Philippines and its people.",
        icon: "🇵🇭",
        quizzes: [
            {
                title: "Know the Philippines",
                difficulty: "easy"
            },
            {
                title: "Beyond the Basics",
                difficulty: "medium"
            },
            {
                title: "Pinoy Brain Challenge",
                difficulty: "hard"
            }
        ]
    }
};

const selectedCategory = quizData[category];
const quizGrid = document.getElementById("quiz-grid");

if (selectedCategory) {

    document.title = selectedCategory.title + " Quizzes | Quizivia";

    document.getElementById("category-title").innerHTML =
        selectedCategory.title + " <span>Quizzes!</span>";

    document.getElementById("category-description").textContent =
        selectedCategory.description;

    selectedCategory.quizzes.forEach((quiz) => {

        const card = document.createElement("article");
        card.className = "category-quiz-card";

        card.innerHTML = `
            <div class="quiz-card-icon">${selectedCategory.icon}</div>

            <div class="quiz-card-details">

                <span class="quiz-card-level">
                    ${quiz.difficulty.toUpperCase()}
                </span>

                <h3>${quiz.title}</h3>

                <p>10 Questions · 5 MINUTES</p>

                <a href="quiz.html?category=${encodeURIComponent(category)}&difficulty=${encodeURIComponent(quiz.difficulty)}"
                   class="btn">
                    PLAY QUIZ →
                </a>

            </div>
        `;

        quizGrid.appendChild(card);
    });

} else {

    document.getElementById("category-title").textContent =
        "Category Not Found";

    document.getElementById("category-description").textContent =
        "Please choose a valid category.";

    quizGrid.innerHTML = `
        <p>Please return to the Categories page and choose a category.</p>
    `;
}
</script>

</body>
</html>
